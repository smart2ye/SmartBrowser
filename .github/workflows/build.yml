name: Build APK (Copy Original Resources)
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: sudo apt update && sudo apt install -y apktool

      - name: Clean problematic files
        run: |
          # حذف الملفات المزعجة فقط (بدون حذف مجلدات كاملة)
          find res/ -type f -name "*\$*.xml" -delete || true
          rm -f res/values/ids.xml res/values/public.xml || true

      - name: Build APK with --copy-original
        run: apktool b . -o app.apk --copy-original

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYe-Browser
          path: app.apk
