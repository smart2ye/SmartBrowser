name: Build APK (Copy Original)
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: sudo apt update && sudo apt install -y apktool

      - name: Clean previous build
        run: rm -rf build/ || true

      - name: Build APK with --copy-original
        run: |
          apktool b . -o app.apk --copy-original -f
          if [ ! -f app.apk ]; then
            echo "❌ Build failed!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartYe-Browser
          path: app.apk
