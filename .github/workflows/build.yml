name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: sudo apt update && sudo apt install -y apktool

      - name: Fix ids.xml and remove $ files
        run: |
          # حذف ملفات $ المزعجة
          find res/ -type f -name "*\$*.xml" -delete || true
          # حذف public.xml لو موجود
          rm -f res/values/public.xml || true
          # إصلاح ids.xml: تحويل <id> إلى <item> (أو حذفه كلياً لو كان صغيراً)
          if [ -f res/values/ids.xml ]; then
            echo "🔧 Fixing ids.xml..."
            # إما تحويل أو حذف، الحذف أسرع وأضمن
            rm -f res/values/ids.xml
            echo "✅ ids.xml removed."
          fi

      - run: apktool b . -o app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartYe-Browser
          path: app.apk
